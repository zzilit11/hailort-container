apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hailo-service-daemon
spec:
  selector:
    matchLabels:
      app: hailo-service
  template:
    metadata:
      labels:
        app: hailo-service
    spec:
      hostNetwork: true
      containers:
        - name: hailo-service
          image: hailo-app:v1
          imagePullPolicy: Never
          command: ["hailort_service", "standalone"]

          envFrom:
            - configMapRef:
                name: hailort-service-env

          #args: ["standalone"]

          # [수정 3] NPU 하드웨어 접근을 위해 privileged 권한 필수
          securityContext:
            privileged: true

          volumeMounts:
            - name: hailort-socket
              mountPath: /tmp
            - name: host-logs
              mountPath: /home/hailo/log_service
            - name: host-traces
              mountPath: /home/hailo/traces

            # [추가 권장] 디바이스 파일 직접 마운트 (privileged가 있으면 생략 가능하나 명시 권장)
            - name: hailo-device
              mountPath: /dev/hailo0

      volumes:
        - name: hailort-socket
          hostPath:
            path: /tmp
            type: Directory
        - name: host-logs
          hostPath:
            path: /home/hailo/log_service
            type: DirectoryOrCreate
        - name: host-traces
          hostPath:
            path: /home/hailo/traces
            type: DirectoryOrCreate

        # [추가 권장]
        - name: hailo-device
          hostPath:
            path: /dev/hailo0
            type: CharDevice
